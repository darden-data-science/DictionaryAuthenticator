name: CI

on:
  pull_request:
  push:
    # master is this repo's default branch. Note the sibling ExternalAuthenticator
    # repo has this wrong — it lists master while its default is main, so its CI
    # never runs on default-branch pushes. Check before copying this file.
    branches:
      - master
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        # Tests run against a real JupyterHub, installed as a dependency above.
        run: python -m unittest discover -s tests -v

      - name: Build distribution artifacts
        run: python -m build
